<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cintia Caetano Maison</title>
  <link rel="icon" href="img/logo-simbolo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <a class="skip" href="#app">Ir para o conteúdo</a>

  <div class="brand">
    <button class="coupon-pill" data-act="copycoupon" aria-label="Copiar cupom CINTIA30">
      <b>30% OFF<br>COM CUPOM</b><span>CINTIA30</span>
    </button>
    <a href="#/" aria-label="Cintia Caetano Maison – início"><img src="img/logo-completo.png"
        alt="Cintia Caetano Maison" class="logo-full"></a>
  </div>

  <header class="nav" id="nav">
    <a href="#/" class="nav-logo" aria-label="Início"><img src="img/logo-simbolo.png" alt=""></a>
    <nav id="menu" aria-label="Categorias">
      <a href="#/colecao/ofertas" class="hot"><i class="dot"></i>Ofertas</a>
      <a href="#/colecao/conjuntos">Conjuntos</a>
      <a href="#/colecao/jeans">Jeans</a>
      <a href="#/colecao/pantalonas">Pantalonas</a>
      <a href="#/colecao/camisas">Camisas</a>
      <a href="#/colecao/novidades">Novidades</a>
    </nav>
    <form class="search" id="searchForm" role="search">
      <button aria-label="Buscar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="10" cy="10" r="6.5" />
          <path d="m15 15 6 6" />
        </svg></button>
      <input id="q" type="search" placeholder="Buscar" aria-label="Buscar produtos">
    </form>
    <div class="icons">
      <button data-act="account" aria-label="Minha conta"><svg viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="8" r="4.5" />
          <path d="M3.5 21c.6-4.6 4-7 8.5-7s7.900 2.400 8.500 7z" />
        </svg></button>
      <a href="#/favoritos" aria-label="Favoritos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8">
          <path d="M12 20.500 4.400 13a5 5 0 0 1 7.100-7.100l.5.5.5-.5A5 5 0 0 1 19.600 13z" />
        </svg></a>
      <a href="#/sacola" class="bag" aria-label="Sacola"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8">
          <path d="M5 8h14l1 13H4zM8.500 8V6.500a3.500 3.500 0 0 1 7 0V8" />
        </svg><em id="badge" hidden>0</em></a>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="foot">
    <img src="img/logo-simbolo.png" alt="">
    <p>Cintia Caetano Maison</p>
    <p class="muted">Pagamento por Pix ou cartão · Troca fácil na loja</p>
  </footer>

  <div id="overlay" hidden></div>
  <aside id="drawer" aria-label="Filtros" hidden></aside>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>

</html>
